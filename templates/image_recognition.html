<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像手语识别 - 手语识别系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 60px 0;
            margin-bottom: 40px;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #6a11cb;
            background-color: #f8f9fa;
        }
        .upload-icon {
            font-size: 3rem;
            color: #6a11cb;
            margin-bottom: 15px;
        }
        .result-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .footer {
            background-color: #343a40;
            color: white;
            padding: 30px 0;
            margin-top: 50px;
        }
        #loading {
            display: none;
        }
        #result {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">手语识别系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/image_recognition">图像识别</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/video_recognition">视频识别</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/realtime_recognition">实时识别</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">关于</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <header class="page-header">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">图像手语识别</h1>
            <p class="lead">上传图像，识别静态图像中的手语动作，快速获取翻译结果。</p>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- 上传区域 -->
                <div class="upload-area mb-4" id="uploadArea">
                    <i class="bi bi-cloud-arrow-up upload-icon"></i>
                    <h3>拖放图像或点击上传</h3>
                    <p class="text-muted">支持 JPG, PNG, JPEG 格式</p>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>

                <!-- 加载中 -->
                <div id="loading" class="text-center my-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在识别手语，请稍候...</p>
                </div>

                <!-- 识别结果 -->
                <div id="result" class="mt-5">
                    <div class="card result-card">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">识别结果</h4>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <img id="resultImage" src="" alt="识别结果" class="img-fluid rounded">
                                </div>
                                <div class="col-md-6">
                                    <h5 class="card-title">手语翻译</h5>
                                    <p id="prediction" class="fs-4 fw-bold text-primary"></p>
                                    <div class="progress mb-3">
                                        <div id="confidenceBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                                    </div>
                                    <p>置信度: <span id="confidence">0%</span></p>
                                    <button class="btn btn-primary mt-3" onclick="uploadNewImage()">上传新图像</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>手语识别系统</h5>
                    <p>基于YOLOv8和OpenPose的手语动作识别系统，旨在提升手语交流效能，优化社会服务与管理。</p>
                </div>
                <div class="col-md-3">
                    <h5>功能</h5>
                    <ul class="list-unstyled">
                        <li><a href="/image_recognition" class="text-white">图像识别</a></li>
                        <li><a href="/video_recognition" class="text-white">视频识别</a></li>
                        <li><a href="/realtime_recognition" class="text-white">实时识别</a></li>
                    </ul>
                </div>
                <div class="col-md-3">
                    <h5>关于</h5>
                    <ul class="list-unstyled">
                        <li><a href="/about" class="text-white">关于我们</a></li>
                        <li><a href="#" class="text-white">联系我们</a></li>
                    </ul>
                </div>
            </div>
            <hr class="my-4 bg-light">
            <div class="text-center">
                <p>&copy; 2025 手语识别系统. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 上传区域点击事件
        document.getElementById('uploadArea').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        // 文件选择事件
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                uploadImage(e.target.files[0]);
            }
        });

        // 拖放事件
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadArea.classList.add('bg-light');
        });
        
        uploadArea.addEventListener('dragleave', function() {
            uploadArea.classList.remove('bg-light');
        });
        
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadArea.classList.remove('bg-light');
            
            if (e.dataTransfer.files.length > 0) {
                uploadImage(e.dataTransfer.files[0]);
            }
        });

        // 上传图像
        function uploadImage(file) {
            // 检查文件类型
            if (!file.type.match('image.*')) {
                alert('请上传图像文件');
                return;
            }
            
            // 显示加载中
            document.getElementById('uploadArea').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            // 创建FormData
            const formData = new FormData();
            formData.append('file', file);
            
            // 发送请求
            fetch('/api/recognize_image', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || '识别失败');
                    });
                }
                return response.json();
            })
            .then(data => {
                // 显示结果
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';
                
                // 设置结果
                document.getElementById('resultImage').src = data.image_url;
                document.getElementById('prediction').textContent = data.prediction;
                
                const confidence = (data.probability * 100).toFixed(2);
                document.getElementById('confidence').textContent = confidence + '%';
                document.getElementById('confidenceBar').style.width = confidence + '%';
                
                // 设置进度条颜色
                const confidenceBar = document.getElementById('confidenceBar');
                if (data.probability >= 0.7) {
                    confidenceBar.className = 'progress-bar bg-success';
                } else if (data.probability >= 0.4) {
                    confidenceBar.className = 'progress-bar bg-warning';
                } else {
                    confidenceBar.className = 'progress-bar bg-danger';
                }
            })
            .catch(error => {
                // 显示错误
                document.getElementById('loading').style.display = 'none';
                document.getElementById('uploadArea').style.display = 'block';
                alert(error.message);
            });
        }

        // 上传新图像
        function uploadNewImage() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('fileInput').value = '';
        }
    </script>
</body>
</html>
